# Both engines, on every push.
#
# The TypeScript core is the specification until the Go port replaces it, so a
# change to either one has to leave the golden files agreeing. That is what the
# Go parity tests check, and why they run beside the TypeScript suite rather
# than after it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The engine has no dependencies outside the standard library, so
          # there is no go.sum and nothing to cache.
          cache: false
      - name: Format
        run: |
          unformatted=$(gofmt -l packages/core-go desktop)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
        working-directory: packages/core-go
      # The engine only. The desktop module links a webview and needs the
      # system libraries for it, so it is tested in the job that has them.
      - name: Test the engine
        run: go test ./...
        working-directory: packages/core-go

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The engine is Go compiled to WebAssembly, and nothing in the suite runs
      # without it, so the toolchain is needed here too.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The engine has no dependencies outside the standard library, so
          # there is no go.sum and nothing to cache.
          cache: false
      - run: bun install --frozen-lockfile
      - name: Build the engine
        run: bun run build:wasm
      - name: Type-check
        run: |
          bun run typecheck
          bun x tsc -p packages/cli/tsconfig.json --noEmit
          bun x tsc -p packages/mcp/tsconfig.json --noEmit
          cd packages/ui && node scripts/typecheck.mjs
      # Before the tests, because it is instant and because the thing it
      # guards against is a commit, not a behaviour: accounts, sessions and
      # the hosted service live in a separate private repository, and a
      # credential or a vendor's schema that reaches a public history is in
      # that history for good.
      - name: The public boundary holds
        run: bun run boundary

      # A raw NUL byte makes a source file binary to git and grep, so it is
      # skipped by every repository-wide edit and invisible in every diff. It
      # cost one scope rename two files and a red build.
      - name: Every source file is text
        run: bun run text

      - name: Test
        # Ninety seconds rather than bun's five: every test in `packages/cli`
        # spawns the command line, and each of those loads a 7.7 MB
        # WebAssembly module before it can answer. Under full-suite contention
        # that has crossed thirty seconds three times, always a different case
        # and always passing alone — a test that fails for having been slow
        # teaches people to re-run CI instead of reading it.
        run: bun test --timeout 90000 packages
      - name: Browser
        # The production build in headless Chrome, driven by real key events:
        # what the suite above cannot see, because it has no browser. The
        # runner image ships Chrome; the script fails rather than skips when
        # CI is set, so a missing browser cannot pass for a passing test.
        run: bun run test:browser

  goldens:
    name: Goldens are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
          cache: false
      # A golden file that no longer matches what the generator writes is a
      # parity test comparing the engine against a stale answer.
      - name: Regenerate
        run: go run ./cmd/golden
        working-directory: packages/core-go
      # Scoped to what the generator writes, so that nothing else in the tree
      # can be mistaken for drift.
      - name: Check for drift
        run: |
          if ! git diff --quiet -- packages/core-go/testdata; then
            echo "The golden files are out of date. Run, from packages/core-go: go run ./cmd/golden"
            git diff --stat -- packages/core-go/testdata
            exit 1
          fi

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      # Wails v3 links GTK 4 and WebKitGTK 6; without the headers the module
      # will not even compile, let alone run.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: bun install --frozen-lockfile
      - name: Build the engine
        run: bun run build:wasm
      # The window imports typed bindings for every Go service, and they are
      # generated rather than committed. Run through `go run` so the tool's
      # version comes from go.mod and cannot drift from the runtime the
      # frontend imports.
      - name: Generate the service bindings
        run: go run github.com/wailsapp/wails/v3/cmd/wails3 generate bindings -clean=true -ts -i
        working-directory: desktop
      # Against the bindings just generated, so a Go method renamed or a field
      # retyped is an error here rather than a call that fails in the window.
      # Vite builds without typechecking, which is how ten errors sat here unseen.
      - name: Type-check the window
        run: bunx tsc --noEmit -p desktop/frontend/tsconfig.json
      # The window's assets are embedded into the Go binary with `go:embed`, so
      # the frontend has to build before the shell will compile at all.
      - name: Build the window
        run: bun run --cwd desktop/frontend build
      - name: Test the services
        run: go test ./...
        working-directory: desktop
      - name: Compile the shell
        run: go build ./...
        working-directory: desktop
