# Both engines, on every push.
#
# The TypeScript core is the specification until the Go port replaces it, so a
# change to either one has to leave the golden files agreeing. That is what the
# Go parity tests check, and why they run beside the TypeScript suite rather
# than after it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            packages/core-go/go.sum
            desktop/go.sum
      - name: Format
        run: |
          unformatted=$(gofmt -l packages/core-go desktop)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
        working-directory: packages/core-go
      - name: Test the engine
        run: go test ./...
        working-directory: packages/core-go
      - name: Test the desktop services
        run: go test ./...
        working-directory: desktop

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The engine is Go compiled to WebAssembly, and the suite runs the
      # compiled module against the TypeScript it replaces, so the toolchain is
      # needed here too.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: packages/core-go/go.sum
      - run: bun install --frozen-lockfile
      - name: Build the engine
        run: bun run build:wasm
      - name: Type-check
        run: |
          bun run typecheck
          bun x tsc -p packages/cli/tsconfig.json --noEmit
          bun x tsc -p packages/mcp/tsconfig.json --noEmit
          cd packages/ui && node scripts/typecheck.mjs
      - name: Test
        run: bun test packages

  goldens:
    name: Goldens are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # A golden file that no longer matches what the generator writes is a
      # parity test comparing the Go engine against a stale answer.
      - name: Regenerate
        run: bun run scripts/golden.ts
      # Scoped to what the generator writes. `bun install` marks the packages'
      # bin entries executable, and a mode change elsewhere is not drift.
      - name: Check for drift
        run: |
          if ! git diff --quiet -- packages/core-go/testdata packages/core-go/presets/data; then
            echo "The golden files are out of date. Run: bun run scripts/golden.ts"
            git diff --stat -- packages/core-go/testdata packages/core-go/presets/data
            exit 1
          fi

  desktop:
    name: Desktop builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: desktop/go.sum
      - run: bun install --frozen-lockfile
      - name: Build the engine
        run: bun run build:wasm
      # The window's assets are embedded into the Go binary with `go:embed`, so
      # the frontend has to build before the shell will compile at all.
      - name: Build the window
        run: bun run --cwd desktop/frontend build
      - name: Compile the shell
        run: go build ./...
        working-directory: desktop
