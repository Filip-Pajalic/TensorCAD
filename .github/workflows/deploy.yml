# The two sites on tensorcad.dev.
#
#   app.tensorcad.dev  — the editor, which is the Vite bundle plus the engine
#   tensorcad.dev      — the same Worker, because the editor is the front page
#   docs.tensorcad.dev — the documentation MkDocs renders from `docs/`
#
# Both are static-asset Workers: nothing is computed on a server, because the
# engine is WebAssembly and runs in the browser. Deployed only from `main`, and
# only when the secrets are set, so a fork does not fail for want of a token it
# was never going to have.
#
# Needs two repository secrets.
#
#   CLOUDFLARE_API_TOKEN   One policy, scoped to the *whole account* — not to
#                          the zone, because uploading a Worker is an
#                          account-level call. Four permissions:
#
#                            Workers Editor          the script and its assets
#                            Workers Routes Write    the three custom domains
#                            DNS Write               which is what a custom
#                                                    domain writes for you
#                            Account Settings Read
#
#   CLOUDFLARE_ACCOUNT_ID  32 hex characters, from `wrangler whoami`.
#
# Set both from the GitHub web UI. A terminal paste silently mangled the token
# once, and the symptom was four minutes of building followed by "No access to
# the specified resource" on the asset upload — which reads like a permissions
# problem and is not one. The first step of both jobs now asks the API whether
# the token is a token, and says so in two seconds.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # The newest commit is the one worth serving; an older deploy still running
  # would otherwise overwrite it.
  cancel-in-progress: true

jobs:
  app:
    name: app.tensorcad.dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Two seconds, before four minutes of building.
      #
      # A token that was pasted wrong does not say so: wrangler fails on the
      # asset upload with "No access to the specified resource", which reads
      # like a permissions problem and sent us round the dashboard twice
      # granting permissions the token already had. `/user/tokens/verify`
      # answers the actual question — is this token a token — and the response
      # body carries no secret.
      - name: Check the token is a token
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          reply=$(curl -sS --max-time 30 https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$reply"
          case "$reply" in
            *'"success":true'*) ;;
            *)
              echo "::error::CLOUDFLARE_API_TOKEN is not valid. Re-set it from the GitHub web UI —" \
                   "a terminal paste is what broke it last time."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
          cache: false
      - run: bun install --frozen-lockfile
      # The engine first: the bundle imports the `.wasm` by URL, and Vite will
      # not find one that has not been built.
      - run: bun run build:wasm
      - run: bun run --cwd packages/ui build

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bunx wrangler deploy
        working-directory: packages/ui

      - name: Say why it did not deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The editor was built and type-checked; only the upload was skipped." >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: docs.tensorcad.dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Two seconds, before four minutes of building.
      #
      # A token that was pasted wrong does not say so: wrangler fails on the
      # asset upload with "No access to the specified resource", which reads
      # like a permissions problem and sent us round the dashboard twice
      # granting permissions the token already had. `/user/tokens/verify`
      # answers the actual question — is this token a token — and the response
      # body carries no secret.
      - name: Check the token is a token
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          reply=$(curl -sS --max-time 30 https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$reply"
          case "$reply" in
            *'"success":true'*) ;;
            *)
              echo "::error::CLOUDFLARE_API_TOKEN is not valid. Re-set it from the GitHub web UI —" \
                   "a terminal paste is what broke it last time."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mkdocs-material
      # For wrangler, which is pinned in the lockfile so both jobs deploy with
      # the same version rather than whatever the registry calls latest.
      - run: bun install --frozen-lockfile
      # Strict, so a cross-reference to a page that does not exist fails here
      # rather than being served.
      - run: mkdocs build --strict

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bunx wrangler deploy -c wrangler.docs.jsonc

      - name: Say why it did not deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The site was built and its links checked; only the upload was skipped." >> "$GITHUB_STEP_SUMMARY"
