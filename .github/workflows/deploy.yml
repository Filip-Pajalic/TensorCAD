# The two sites this repository serves on tensorcad.dev.
#
#   tensorcad.dev      — the editor, which is the Vite bundle plus the engine
#   docs.tensorcad.dev — the documentation MkDocs renders from `docs/`
#
# Two hostnames and no more. A custom domain belongs to whichever Worker
# claimed it most recently, so adding a route here can take a hostname away
# from whatever is serving it, on the next push to main, with nothing to warn
# you. Claim what this repository builds and nothing else.
#
# Both are static-asset Workers: nothing is computed on a server, because the
# engine is WebAssembly and runs in the browser. Deployed only from `main`, and
# only when the secrets are set, so a fork does not fail for want of a token it
# was never going to have.
#
# Needs two repository secrets.
#
#   CLOUDFLARE_API_TOKEN   An *account* token — Manage Account > Account API
#                          Tokens, not the user token page. Cloudflare calls
#                          these service principals and recommends them for
#                          CI/CD; they carry a `cfat_` prefix and are 53
#                          characters, not the 40 a user token is.
#
#                          One policy, scoped to the whole account — not to
#                          the zone, because uploading a Worker is an
#                          account-level call. Four permissions:
#
#                            Workers Editor          the script and its assets
#                            Workers Routes Write    the two custom domains
#                            DNS Write               which is what a custom
#                                                    domain writes for you
#                            Account Settings Read
#
#   CLOUDFLARE_ACCOUNT_ID  32 hex characters, from `wrangler whoami`.
#
# The first step of both jobs asks the API whether it knows the token, before
# anything is built. That exists because the failure it replaces was four
# minutes of building followed by "No access to the specified resource" on the
# asset upload — which reads like a permissions problem, is not one, and cost
# two trips round the dashboard granting permissions the token already had.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # The newest commit is the one worth serving; an older deploy still running
  # would otherwise overwrite it.
  cancel-in-progress: true

jobs:
  app:
    name: tensorcad.dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Two seconds, before four minutes of building.
      #
      # A token the API will not accept does not say why: wrangler fails on the
      # asset upload with "No access to the specified resource", which reads
      # like a permissions problem and sent us round the dashboard twice
      # granting permissions the token already had. Asking the API whether it
      # knows the token at all is a better first question, and the response
      # body carries no secret.
      - name: Check the token is a token
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          # There are two kinds of token and two endpoints to match. An
          # account-owned token is not a user token, and asking
          # /user/tokens/verify about one gets "Invalid API Token" — which is
          # true of the question and says nothing about the token. That
          # mistake cost an afternoon, so both are tried.
          #
          # An account token is the right kind here: Cloudflare describes them
          # as service principals for exactly this, durable past whoever set
          # the integration up. It is also why counting characters proved
          # nothing — a new account token carries a `cfat_` prefix and runs to
          # 53, where the user-token format everyone quotes is 40.
          #
          #   https://developers.cloudflare.com/fundamentals/api/get-started/account-owned-tokens/
          verify() {
            curl -sS --max-time 30 "https://api.cloudflare.com/client/v4$1/tokens/verify" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          }
          reply=$(verify "/accounts/$CLOUDFLARE_ACCOUNT_ID")
          case "$reply" in
            *'"success":true'*) echo "account token: valid" ;;
            *)
              echo "as an account token: $reply"
              reply=$(verify /user)
              case "$reply" in
                *'"success":true'*) echo "user token: valid" ;;
                *) echo "as a user token: $reply"
                   # A warning, not a failure. Being unable to verify a token
                   # is not the same as the token being unusable, and wrangler
                   # is the one whose opinion actually matters — let it try and
                   # report what the API tells *it*.
                   echo "::warning::Neither verify endpoint accepted the token; letting wrangler try anyway." ;;
              esac
              ;;
          esac

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
          cache: false
      - run: bun install --frozen-lockfile
      # The engine first: the bundle imports the `.wasm` by URL, and Vite will
      # not find one that has not been built.
      - run: bun run build:wasm
      - run: bun run --cwd packages/ui build

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bunx wrangler deploy
        working-directory: packages/ui

      - name: Say why it did not deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The editor was built and type-checked; only the upload was skipped." >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: docs.tensorcad.dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Two seconds, before four minutes of building.
      #
      # A token the API will not accept does not say why: wrangler fails on the
      # asset upload with "No access to the specified resource", which reads
      # like a permissions problem and sent us round the dashboard twice
      # granting permissions the token already had. Asking the API whether it
      # knows the token at all is a better first question, and the response
      # body carries no secret.
      - name: Check the token is a token
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          # There are two kinds of token and two endpoints to match. An
          # account-owned token is not a user token, and asking
          # /user/tokens/verify about one gets "Invalid API Token" — which is
          # true of the question and says nothing about the token. That
          # mistake cost an afternoon, so both are tried.
          #
          # An account token is the right kind here: Cloudflare describes them
          # as service principals for exactly this, durable past whoever set
          # the integration up. It is also why counting characters proved
          # nothing — a new account token carries a `cfat_` prefix and runs to
          # 53, where the user-token format everyone quotes is 40.
          #
          #   https://developers.cloudflare.com/fundamentals/api/get-started/account-owned-tokens/
          verify() {
            curl -sS --max-time 30 "https://api.cloudflare.com/client/v4$1/tokens/verify" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          }
          reply=$(verify "/accounts/$CLOUDFLARE_ACCOUNT_ID")
          case "$reply" in
            *'"success":true'*) echo "account token: valid" ;;
            *)
              echo "as an account token: $reply"
              reply=$(verify /user)
              case "$reply" in
                *'"success":true'*) echo "user token: valid" ;;
                *) echo "as a user token: $reply"
                   # A warning, not a failure. Being unable to verify a token
                   # is not the same as the token being unusable, and wrangler
                   # is the one whose opinion actually matters — let it try and
                   # report what the API tells *it*.
                   echo "::warning::Neither verify endpoint accepted the token; letting wrangler try anyway." ;;
              esac
              ;;
          esac

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mkdocs-material
      # For wrangler, which is pinned in the lockfile so both jobs deploy with
      # the same version rather than whatever the registry calls latest.
      - run: bun install --frozen-lockfile
      # Strict, so a cross-reference to a page that does not exist fails here
      # rather than being served.
      - run: mkdocs build --strict

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bunx wrangler deploy -c wrangler.docs.jsonc

      - name: Say why it did not deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The site was built and its links checked; only the upload was skipped." >> "$GITHUB_STEP_SUMMARY"
