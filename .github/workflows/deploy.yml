# The two sites on tensorcad.dev.
#
#   app.tensorcad.dev  — the editor, which is the Vite bundle plus the engine
#   tensorcad.dev      — the same Worker, because the editor is the front page
#   docs.tensorcad.dev  — the documentation MkDocs renders from `docs/`
#
# Both are static-asset Workers: nothing is computed on a server, because the
# engine is WebAssembly and runs in the browser. Deployed only from `main`, and
# only when the secrets are set, so a fork does not fail for want of a token it
# was never going to have.
#
# Needs two repository secrets. Cloudflare's own recipe for this is the
# "Edit Cloudflare Workers" permission template, scoped to one account and to
# the tensorcad.dev zone:
#
#   https://developers.cloudflare.com/workers/ci-cd/external-cicd/github-actions/
#
#   CLOUDFLARE_API_TOKEN   Create Token > Custom > "Edit Cloudflare Workers".
#                          Account resources: just this account.
#                          Zone resources: just tensorcad.dev.
#                          If the deploy is then refused on the *domains* rather
#                          than the upload, add Zone > DNS: Edit — a custom
#                          domain is Cloudflare writing a DNS record for you.
#   CLOUDFLARE_ACCOUNT_ID  the account the zone is in, from the dashboard
#                          sidebar or `wrangler whoami`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # The newest commit is the one worth serving; an older deploy still running
  # would otherwise overwrite it.
  cancel-in-progress: true

jobs:
  app:
    name: app.tensorcad.dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
          cache: false
      - run: bun install --frozen-lockfile
      # The engine first: the bundle imports the `.wasm` by URL, and Vite will
      # not find one that has not been built.
      - run: bun run build:wasm
      - run: bun run --cwd packages/ui build

      # Before the upload, because "No access to the specified resource" from
      # the API is the same message whether the token cannot reach the account
      # or the account id is not the one the token is for. This says which,
      # without printing either: the id is masked, its *length* is not, and a
      # 32 that is not 32 is a paste that brought a newline with it.
      - name: Who the token is
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "account id length: ${#CLOUDFLARE_ACCOUNT_ID} (should be 32)"
          echo "token length: ${#CLOUDFLARE_API_TOKEN} (should be 40)"
          bunx wrangler whoami || true

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bunx wrangler deploy
        working-directory: packages/ui

      - name: Say why it did not deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The editor was built and type-checked; only the upload was skipped." >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: docs.tensorcad.dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mkdocs-material
      # For wrangler, which is pinned in the lockfile so both jobs deploy with
      # the same version rather than whatever the registry calls latest.
      - run: bun install --frozen-lockfile
      # Strict, so a cross-reference to a page that does not exist fails here
      # rather than being served.
      - run: mkdocs build --strict

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bunx wrangler deploy -c wrangler.docs.jsonc

      - name: Say why it did not deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The site was built and its links checked; only the upload was skipped." >> "$GITHUB_STEP_SUMMARY"
