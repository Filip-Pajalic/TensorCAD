# Cut a release.
#
# Triggered by a tag like `v0.1.0`, or by hand from the Actions tab. Three
# desktop builds and the engine itself, attached to a GitHub release.
#
# The engine is published alongside the applications on purpose: it is one
# WebAssembly file with a JSON interface, and somebody who wants the analysis
# without the editor should be able to take it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to release, e.g. v0.1.0. Create it first."
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The gate. A release that does not pass its own tests is not a release, and
  # the tag is already public by the time anyone notices.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          # From the module rather than a number here, so a bump moves one file.
          go-version-file: packages/core-go/go.mod
          # The engine has no dependencies outside the standard library, so
          # there is no go.sum and nothing to cache.
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build:wasm
      # The same gate CI runs, because a release cut from a green main can
      # still be cut from the wrong main: this is the last place to find out.
      - name: Format
        run: |
          unformatted=$(gofmt -l packages/core-go desktop)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
        working-directory: packages/core-go
      - name: Test the engine
        run: go test ./...
        working-directory: packages/core-go
      - name: Type-check
        run: |
          bun run typecheck
          bun x tsc -p packages/cli/tsconfig.json --noEmit
          bun x tsc -p packages/mcp/tsconfig.json --noEmit
          cd packages/ui && node scripts/typecheck.mjs
      # Thirty seconds rather than bun's five: the command-line tests spawn a
      # process each, and each one loads the engine before it answers.
      - run: bun test --timeout 90000 packages
      # A release whose goldens are stale is a release whose tests were
      # comparing the engine against an answer nobody rewrote.
      - name: Goldens are current
        run: |
          go run ./cmd/golden
          if ! git diff --quiet -- testdata; then
            echo "The golden files are out of date."
            git diff --stat -- testdata
            exit 1
          fi
        working-directory: packages/core-go

  engine:
    name: Engine
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          # From the module rather than a number here, so a bump moves one file.
          go-version-file: packages/core-go/go.mod
          # The engine has no dependencies outside the standard library, so
          # there is no go.sum and nothing to cache.
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build:wasm
      # The loader comes from the same Go release that built the module, so the
      # two travel together or neither works.
      - name: Package
        run: |
          mkdir -p dist/tensorcad-engine
          cp packages/engine/wasm/tensorcad.wasm dist/tensorcad-engine/
          cp packages/engine/vendor/wasm_exec.js dist/tensorcad-engine/
          cp packages/engine/README.md dist/tensorcad-engine/
          cp LICENSE.md dist/tensorcad-engine/
          cd dist && tar -czf tensorcad-engine-wasm.tar.gz tensorcad-engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: dist/tensorcad-engine-wasm.tar.gz

  # The one-click install for Claude Desktop. Built here rather than by hand,
  # and started under Node before it is attached: Claude Desktop runs it with
  # Node, this repository runs it with Bun, and the difference has broken it
  # twice already.
  bundle:
    name: Desktop bundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
          cache: false
      - run: bun install --frozen-lockfile
      - name: Build and start it
        run: bun run build:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist/tensorcad.mcpb

  # The packages somebody would install rather than download: the engine, the
  # MCP server, and the editor for anybody assembling their own around it.
  #
  # None is published in the form this repository consumes it: `main` points at
  # TypeScript that Node cannot import, the server's `bin` carries a Bun
  # shebang, the editor is JSX and uncompiled Tailwind, and the dependencies
  # between them are written `workspace:*`, which npm rejects. `build:dist`
  # emits the publishable form, packs it, installs it into an empty directory
  # and checks it under Node — so what is uploaded is the thing that was
  # tested, not a hopeful repackaging of it.
  npm:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For provenance: the attestation says which workflow at which commit
      # built the tarball, which is the one claim a consumer can check.
      id-token: write
    # At the job rather than the step, because a step's `if` is evaluated before
    # its own `env` block and so cannot see it.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/core-go/go.mod
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build:wasm
      - name: Build, pack and start it under Node
        run: bun run build:dist

      # The version in the tag is the version that gets published. A mismatch
      # means the tag was cut from a commit that forgot the bump, and finding
      # that out after the upload is finding it out too late.
      - name: The tag and the version agree
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          want="${tag#v}"
          for pkg in packages/engine/npm packages/mcp/npm packages/ui/npm; do
            got=$(node -p "require('./$pkg/package.json').version")
            if [ "$got" != "$want" ]; then
              echo "$pkg is $got but the tag says $want"
              exit 1
            fi
          done
          got=$(node -p "require('./packages/mcp/server.json').version")
          if [ "$got" != "$want" ]; then
            echo "server.json is $got but the tag says $want"
            exit 1
          fi

      # The engine first, and then in dependency order: both the server and the
      # editor depend on it, and a package published against a version that is
      # not there yet is one nobody can install.
      - name: Publish
        # Absent on a fork and until somebody sets it, and a release that fails
        # for want of a secret is worse than one that says it skipped this.
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          for pkg in engine mcp ui; do
            cd "$GITHUB_WORKSPACE/packages/$pkg/npm"
            npm publish --provenance --access public --ignore-scripts
          done

      - name: Say why it did not publish
        if: ${{ env.NPM_TOKEN == '' }}
        run: |
          echo "NPM_TOKEN is not set, so nothing was published." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Every package was built, packed, installed into an empty directory and checked under Node, and the tarballs are attached to the release. Set the secret and re-run this job to publish them." >> "$GITHUB_STEP_SUMMARY"

      # Attached either way: somebody who cannot install from npm can still take
      # the exact tarball that would have been uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: dist/verify/*.tgz

  # The MCP registry, after npm, because an entry is a pointer at a package:
  # the registry fetches `@tensor-cad/mcp` at this version and refuses the
  # entry unless the package's `mcpName` is the name being published.
  registry:
    name: MCP registry
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry takes the workflow's own OIDC token as proof of the
      # io.github.<owner>/* namespace, so there is no secret to set or to leak.
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Say why it did not publish
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not set, so npm has no package for a registry entry to point at." >> "$GITHUB_STEP_SUMMARY"

      # npm's read path has lagged its publish by minutes, and the registry
      # reads it. Publishing the entry before npm serves the version is a
      # rejected entry for a package that is in fact there.
      - name: Wait for npm to serve this version
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          version=$(node -p "require('./packages/mcp/server.json').version")
          name=$(node -p "require('./packages/mcp/server.json').name")
          for i in $(seq 1 30); do
            got=$(npm view "@tensor-cad/mcp@${version}" mcpName 2>/dev/null || true)
            if [ "$got" = "$name" ]; then exit 0; fi
            sleep 20
          done
          echo "npm never served @tensor-cad/mcp@${version} with mcpName ${name}"
          exit 1

      # Pinned rather than `latest`: a publisher that changed under the release
      # would change what gets published without a commit here saying so.
      - name: Install mcp-publisher
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Publish
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          ./mcp-publisher login github-oidc
          cd packages/mcp
          ../../mcp-publisher publish
          echo "Published $(node -p "require('./server.json').name") $(node -p "require('./server.json').version") to the MCP registry." >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-amd64
            binary: tensorcad.exe
          - os: macos-latest
            label: macos-arm64
            binary: tensorcad
          - os: ubuntu-latest
            label: linux-amd64
            binary: tensorcad
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      # Wails v3 links GTK 4 and WebKitGTK 6. Windows and macOS ship a webview.
      - name: System libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - run: bun install --frozen-lockfile
      - name: Build the engine
        run: bun run build:wasm
      # The window imports typed bindings for every Go service, and they are
      # generated rather than committed.
      - name: Generate the service bindings
        run: go run github.com/wailsapp/wails/v3/cmd/wails3 generate bindings -clean=true -ts -i
        working-directory: desktop
      # The window's assets are embedded into the binary with `go:embed`, so
      # the frontend builds first or the shell does not compile.
      - name: Build the window
        run: bun run --cwd desktop/frontend build
      - name: Compile the shell
        run: go build -ldflags "-s -w" -o "../dist/${{ matrix.binary }}" .
        working-directory: desktop

      - name: Package
        shell: bash
        run: |
          cd dist
          tar -czf "tensorcad-${{ matrix.label }}.tar.gz" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: dist/tensorcad-${{ matrix.label }}.tar.gz

  publish:
    name: Publish
    needs: [engine, bundle, desktop, npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Everything that is published, not just the tarballs: the bundle is a
      # file people download and run, which is the case checksums are for.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum tensorcad-*.tar.gz tensorcad.mcpb > checksums.txt
          cat checksums.txt

      # What changed, from the commits themselves. A release whose notes say
      # "various fixes" is a release nobody can decide whether to take.
      - name: Notes
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "No tag ${tag}. Create and push it first: git tag ${tag} && git push origin ${tag}"
            exit 1
          fi
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || echo "")
          {
            echo "notes<<TENSORCAD_NOTES"
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
              echo
              git log --no-merges --pretty='- %s' "${previous}..${tag}"
            else
              echo "## First release"
              echo
              git log --no-merges --pretty='- %s' -20 "${tag}"
            fi
            echo
            echo "## Downloads"
            echo
            echo "- \`tensorcad-<platform>.tar.gz\` — the desktop editor."
            echo "- \`tensorcad-engine-wasm.tar.gz\` — the analysis engine as one"
            echo "  WebAssembly module with its loader, for embedding anywhere else."
              echo "- \`tensorcad.mcpb\` — the MCP server as a one-click install for"
            echo "  Claude Desktop."
            echo "- \`tensorcad-engine-<version>.tgz\` and \`tensorcad-mcp-<version>.tgz\` —"
            echo "  the npm packages, for installing without npm."
            echo
            echo "Checksums are in \`checksums.txt\`."
            echo "TENSORCAD_NOTES"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: TensorCAD ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
